slam_toolbox:
  ros__parameters:
    use_sim_time: true

    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    map_update_interval: 1.0
    resolution: 0.05

    max_laser_range: 8.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    throttle_scans: 1
    transform_publish_period: 0.02
